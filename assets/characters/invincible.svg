<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%">
  <defs>
    <!-- Halftone Dot Pattern for suit shading -->
    <pattern id="invHalftone" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="#080808" opacity="0.3"/>
    </pattern>
    <!-- Speed Glow Gradient -->
    <linearGradient id="invSpeedGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#FFE500" stop-opacity="0"/>
      <stop offset="60%" stop-color="#FFE500" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1769FF" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="comicShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="10" stdDeviation="0" flood-color="#080808" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- Background Speed Streaks (Trailing behind flying hero) -->
  <g class="speed-streaks" opacity="0.85">
    <polygon points="120,580 90,640 180,480 190,430" fill="url(#invSpeedGrad)"/>
    <polygon points="210,610 180,650 260,520 270,470" fill="url(#invSpeedGrad)"/>
    <polygon points="40,510 10,570 120,400 135,360" fill="url(#invSpeedGrad)"/>
    <line x1="80" y1="620" x2="220" y2="350" stroke="#FFE500" stroke-width="4" stroke-dasharray="16 10"/>
    <line x1="160" y1="640" x2="290" y2="380" stroke="#1769FF" stroke-width="4" stroke-dasharray="24 14"/>
  </g>

  <!-- Flying Hero Silhouette & Anatomy -->
  <g id="invincible-character" filter="url(#comicShadow)">
    
    <!-- Left Trailing Leg (Bent back in flight) -->
    <g class="limb-leg-left">
      <!-- Boot (Yellow) -->
      <polygon points="80,590 120,560 150,585 135,630 75,615" fill="#FFE500" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <polygon points="85,595 110,575 125,590 115,620 80,610" fill="#E6CE00"/>
      <!-- Calf & Thigh (Electric Blue) -->
      <polygon points="120,560 180,480 220,510 150,585" fill="#1769FF" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <polygon points="135,550 175,490 200,505 155,570" fill="#0D4EC7"/>
    </g>

    <!-- Right Leading Leg (Extending diagonally) -->
    <g class="limb-leg-right">
      <!-- Thigh (Electric Blue) -->
      <polygon points="190,460 250,530 290,510 230,440" fill="#1769FF" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <!-- Boot (Yellow) -->
      <polygon points="250,530 300,590 340,570 310,520 290,510" fill="#FFE500" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <polygon points="265,540 295,580 325,565 305,530" fill="#E6CE00"/>
    </g>

    <!-- Torso (Yellow Core, Blue Flanks, Comic Inking) -->
    <g class="body-torso">
      <!-- Dark Blue Torso Base -->
      <polygon points="180,450 280,430 320,290 190,300" fill="#1769FF" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <!-- Blue Abdominal Shading -->
      <polygon points="190,445 220,440 230,360 195,365" fill="#0D4EC7"/>
      <!-- Central Vivid Yellow Chest & Waist Panel -->
      <polygon points="210,445 280,430 310,310 220,315" fill="#FFE500" stroke="#080808" stroke-width="4.5" stroke-linejoin="round"/>
      <polygon points="225,435 270,425 295,325 230,330" fill="#FFF04D"/>
      
      <!-- Iconic Central "i" Chevron Insignia -->
      <circle cx="260" cy="355" r="14" fill="#1769FF" stroke="#080808" stroke-width="3.5"/>
      <circle cx="260" cy="355" r="7" fill="#FFE500"/>
      <polygon points="252,375 268,375 264,410 256,410" fill="#1769FF" stroke="#080808" stroke-width="3"/>
    </g>

    <!-- Left Trailing Arm (Braced for flight) -->
    <g class="limb-arm-left">
      <!-- Upper Arm (Electric Blue) -->
      <polygon points="180,310 130,350 150,380 195,340" fill="#1769FF" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <!-- Forearm & Glove (Yellow) -->
      <polygon points="130,350 90,400 120,425 150,380" fill="#FFE500" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <!-- Fist -->
      <circle cx="95" cy="415" r="20" fill="#FFE500" stroke="#080808" stroke-width="4.5"/>
      <path d="M85,410 C90,405 105,405 110,415" stroke="#080808" stroke-width="3" fill="none"/>
    </g>

    <!-- Right Leading Arm (Punching Forward Into Screen / Camera) -->
    <g class="limb-arm-right">
      <!-- Shoulder Deltoid (Yellow / Blue) -->
      <polygon points="310,295 380,270 395,320 330,335" fill="#FFE500" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <!-- Forearm Powering Forward (Yellow) -->
      <polygon points="380,270 435,210 470,240 400,315" fill="#FFE500" stroke="#080808" stroke-width="5.5" stroke-linejoin="round"/>
      <polygon points="395,275 435,225 455,245 410,295" fill="#FFF266"/>
      
      <!-- Giant Comic Flying Fist (Perspective Zoom) -->
      <g class="flying-fist">
        <!-- Knuckles & Glove Outer -->
        <polygon points="430,205 470,165 500,195 480,250 440,240" fill="#FFE500" stroke="#080808" stroke-width="6" stroke-linejoin="round"/>
        <!-- Individual Knuckle Cuts -->
        <circle cx="455" cy="180" r="10" fill="#FFE500" stroke="#080808" stroke-width="3.5"/>
        <circle cx="478" cy="195" r="10" fill="#FFE500" stroke="#080808" stroke-width="3.5"/>
        <circle cx="488" cy="220" r="10" fill="#FFE500" stroke="#080808" stroke-width="3.5"/>
        <!-- Thumb Locked In -->
        <polygon points="425,200 445,185 455,210 435,225" fill="#E6CE00" stroke="#080808" stroke-width="3"/>
      </g>
    </g>

    <!-- Head & Flowing Hair (Determined Flying Expression) -->
    <g class="head-group">
      <!-- Neck -->
      <polygon points="265,305 295,290 305,255 275,265" fill="#FFCF9E" stroke="#080808" stroke-width="4"/>
      <!-- Jaw & Chin (Skin tone with comic inking) -->
      <polygon points="275,265 315,250 330,220 295,210 270,230" fill="#FFCF9E" stroke="#080808" stroke-width="4.5" stroke-linejoin="round"/>
      
      <!-- Comic Cowl / Mask (Yellow & Blue) -->
      <path d="M285,240 C300,230 325,225 335,200 C345,170 320,150 290,160 C265,170 260,200 275,235 Z" fill="#FFE500" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <path d="M290,230 C310,220 328,210 330,190" stroke="#080808" stroke-width="3.5" fill="none"/>
      
      <!-- Iconic White Eye Lenses with Heavy Black Inking -->
      <polygon points="305,190 325,180 322,196 308,202" fill="#FFFFFF" stroke="#080808" stroke-width="3.5"/>
      <polygon points="280,198 298,190 295,206 282,210" fill="#FFFFFF" stroke="#080808" stroke-width="3.5"/>

      <!-- Wind-Blown Dark Brown Hair (Flowing Backward in Flight) -->
      <path d="M285,160 C265,135 240,130 210,135 C230,150 240,165 245,180 C230,165 215,160 190,170 C215,185 225,200 230,215 C215,205 200,205 180,215 C205,230 220,240 235,245 C250,220 265,185 285,160 Z" fill="#2B1A0E" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <!-- Hair Highlights -->
      <path d="M245,150 C260,150 270,165 275,175" stroke="#5E3B20" stroke-width="3" fill="none"/>
    </g>

    <!-- Comic Impact Burst Ring at Waist -->
    <g class="comic-energy-arcs" stroke="#FFE500" stroke-width="3.5" fill="none">
      <path d="M190,320 C220,290 290,280 340,310"/>
      <path d="M180,340 C210,310 280,300 330,330"/>
    </g>

  </g>
</svg>

