<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%">
  <defs>
    <!-- Cosmic Cyan & Yellow Radial Glow -->
    <radialGradient id="allenAura" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#FFE500" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#080808" stop-opacity="0"/>
    </radialGradient>
    <filter id="allenShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="10" stdDeviation="0" flood-color="#080808" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Background Cosmic Rings & Planetary Moons -->
  <g class="allen-backdrop" opacity="0.9">
    <circle cx="250" cy="300" r="220" fill="url(#allenAura)"/>
    <!-- Orbiting Cosmic Energy Ring -->
    <ellipse cx="250" cy="300" rx="210" ry="80" fill="none" stroke="#00D2FF" stroke-width="4" stroke-dasharray="20 12" transform="rotate(-20 250 300)"/>
    <ellipse cx="250" cy="300" rx="190" ry="60" fill="none" stroke="#FFE500" stroke-width="3" stroke-dasharray="14 8" transform="rotate(35 250 300)"/>
    <!-- Distant Cosmic Star Dots -->
    <circle cx="120" cy="180" r="5" fill="#FFE500"/>
    <circle cx="390" cy="160" r="6" fill="#00D2FF"/>
    <circle cx="430" cy="380" r="5" fill="#FFE500"/>
    <circle cx="80" cy="420" r="7" fill="#00D2FF"/>
  </g>

  <!-- Allen the Alien Character Artwork -->
  <g id="allenthealien-character" filter="url(#allenShadow)">
    
    <!-- Lower Body: Muscular Orange Legs & Cyan Cosmic Tights -->
    <g class="legs-group">
      <!-- Left Leg -->
      <polygon points="190,420 170,520 150,605 200,610 215,520 225,420" fill="#FF7700" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <!-- Cyan Boot -->
      <polygon points="150,605 140,635 205,635 200,610" fill="#00B4D8" stroke="#080808" stroke-width="5"/>
      <!-- Right Leg -->
      <polygon points="255,420 265,520 280,605 235,610 230,520 235,420" fill="#FF7700" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <!-- Cyan Boot -->
      <polygon points="235,610 230,635 290,635 280,605" fill="#00B4D8" stroke="#080808" stroke-width="5"/>
      <!-- Orange Muscle Contours -->
      <path d="M190,440 L178,500 L195,515" stroke="#080808" stroke-width="3.5" fill="none"/>
      <path d="M250,440 L255,500 L242,515" stroke="#080808" stroke-width="3.5" fill="none"/>
    </g>

    <!-- Torso: Muscular Bright Orange Body & Cyan Space Harness -->
    <g class="torso-group">
      <!-- Orange Muscular Torso Base -->
      <polygon points="170,220 330,220 300,430 190,430" fill="#FF8800" stroke="#080808" stroke-width="5.5" stroke-linejoin="round"/>
      <polygon points="180,230 200,230 215,420 195,420" fill="#E65500"/>
      <polygon points="320,230 300,230 285,420 295,420" fill="#E65500"/>

      <!-- High-Tech Cyan & Yellow Space Vest / Harness -->
      <polygon points="180,225 230,225 210,360 175,320" fill="#00B4D8" stroke="#080808" stroke-width="4.5" stroke-linejoin="round"/>
      <polygon points="320,225 270,225 290,360 325,320" fill="#00B4D8" stroke="#080808" stroke-width="4.5" stroke-linejoin="round"/>
      
      <!-- Central Yellow Power Buckle -->
      <circle cx="250" cy="330" r="18" fill="#FFE500" stroke="#080808" stroke-width="4"/>
      <polygon points="250,318 260,338 240,338" fill="#080808"/>

      <!-- Cyan Belt -->
      <polygon points="190,410 300,410 295,435 195,435" fill="#00B4D8" stroke="#080808" stroke-width="4.5"/>
      <rect x="238" y="415" width="24" height="15" fill="#FFE500" stroke="#080808" stroke-width="2.5"/>

      <!-- Heavy Inked Pectoral Muscle Definition -->
      <path d="M200,300 C220,315 240,315 250,300" stroke="#080808" stroke-width="3.5" fill="none"/>
      <path d="M250,300 C260,315 280,315 300,300" stroke="#080808" stroke-width="3.5" fill="none"/>
      <line x1="250" y1="305" x2="250" y2="400" stroke="#080808" stroke-width="3"/>
    </g>

    <!-- Arms: Confident Thumbs-Up & Hero Wave -->
    <g class="arms-group">
      <!-- Left Arm: Hand on Hip (Confident Hero Stance) -->
      <polygon points="175,225 120,280 135,360 185,320" fill="#FF8800" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <!-- Cyan Wristband -->
      <polygon points="120,280 90,340 130,360 135,300" fill="#00B4D8" stroke="#080808" stroke-width="4.5" stroke-linejoin="round"/>
      <circle cx="115" cy="370" r="18" fill="#FF8800" stroke="#080808" stroke-width="4.5"/>
      
      <!-- Right Arm: Energetic Thumbs Up / Cosmic Champion Wave -->
      <polygon points="325,225 385,250 420,320 370,300" fill="#FF8800" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <polygon points="385,250 435,275 410,340 375,310" fill="#FF8800" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <!-- Cyan Wristband -->
      <polygon points="410,290 445,310 430,340 395,320" fill="#00B4D8" stroke="#080808" stroke-width="4"/>
      
      <!-- Iconic Giant Thumbs-Up Fist -->
      <g class="thumbs-up-hand">
        <!-- Main Fist -->
        <circle cx="440" cy="340" r="22" fill="#FF8800" stroke="#080808" stroke-width="5"/>
        <!-- Big Extended Thumb -->
        <polygon points="430,325 435,280 460,285 455,330" fill="#FF8800" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
        <path d="M438,295 L454,298" stroke="#080808" stroke-width="3"/>
        <!-- Inked Knuckle Cuts -->
        <path d="M428,342 C438,340 448,340 458,345" stroke="#080808" stroke-width="3" fill="none"/>
        <path d="M428,354 C436,352 444,352 452,357" stroke="#080808" stroke-width="3" fill="none"/>
      </g>
    </g>

    <!-- Head: Iconic Single-Eyed Unoxian Head with Crest -->
    <g class="head-group">
      <!-- Strong Muscular Neck -->
      <polygon points="225,195 275,195 285,150 215,150" fill="#FF8800" stroke="#080808" stroke-width="4"/>
      <!-- Dome-Shaped Orange Head & Distinctive Antenna Crest -->
      <path d="M210,140 C195,95 230,60 250,50 C270,60 305,95 290,140 C280,165 250,185 220,165 Z" fill="#FF8800" stroke="#080808" stroke-width="5.5" stroke-linejoin="round"/>
      
      <!-- Central Head Fin / Antenna Ridge -->
      <polygon points="244,45 256,45 253,90 247,90" fill="#FFE500" stroke="#080808" stroke-width="3"/>
      
      <!-- Giant Iconic Single Expressive Eye -->
      <g class="giant-cyclops-eye">
        <!-- Outer Eye Rim -->
        <ellipse cx="250" cy="115" rx="36" ry="30" fill="#FFFFFF" stroke="#080808" stroke-width="5"/>
        <!-- Large Dark Pupil with Cyan Iris -->
        <circle cx="250" cy="115" r="18" fill="#00B4D8" stroke="#080808" stroke-width="3.5"/>
        <circle cx="250" cy="115" r="11" fill="#080808"/>
        <!-- Light Glint / Reflection -->
        <circle cx="244" cy="109" r="4.5" fill="#FFFFFF"/>
        <circle cx="256" cy="120" r="2" fill="#FFFFFF"/>
        <!-- Comic Brow Arc -->
        <path d="M218,88 C238,80 262,80 282,88" stroke="#080808" stroke-width="4.5" fill="none"/>
      </g>

      <!-- Broad Confident Alien Grin -->
      <path d="M225,152 C240,168 260,168 275,152" stroke="#080808" stroke-width="4.5" fill="none"/>
      <!-- Tooth Line -->
      <polygon points="238,155 262,155 256,162 244,162" fill="#FFFFFF" stroke="#080808" stroke-width="2"/>
    </g>

  </g>
</svg>

