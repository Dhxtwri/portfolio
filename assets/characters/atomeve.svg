<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%">
  <defs>
    <!-- Radiant Pink / Magenta Atomic Glow -->
    <radialGradient id="eveAura" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FF3399" stop-opacity="0.5"/>
      <stop offset="65%" stop-color="#FF66B2" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#080808" stop-opacity="0"/>
    </radialGradient>
    <filter id="eveShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="10" stdDeviation="0" flood-color="#080808" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Background Orbiting Atomic Electron Rings & Energy Trails -->
  <g class="eve-backdrop" opacity="0.9">
    <circle cx="250" cy="310" r="210" fill="url(#eveAura)"/>
    <!-- Atomic Matter Manipulation Rings -->
    <ellipse cx="250" cy="300" rx="200" ry="70" fill="none" stroke="#FF3399" stroke-width="3.5" transform="rotate(-30 250 300)"/>
    <ellipse cx="250" cy="300" rx="200" ry="70" fill="none" stroke="#FF66B2" stroke-width="3" stroke-dasharray="16 10" transform="rotate(30 250 300)"/>
    <ellipse cx="250" cy="300" rx="180" ry="55" fill="none" stroke="#FFE500" stroke-width="2.5" stroke-dasharray="12 8" transform="rotate(85 250 300)"/>
    <!-- Sparkling Energy Dots -->
    <circle cx="100" cy="220" r="6" fill="#FF3399"/>
    <circle cx="400" cy="210" r="7" fill="#FFE500"/>
    <circle cx="340" cy="420" r="5" fill="#FF66B2"/>
    <circle cx="150" cy="410" r="6" fill="#FFFFFF"/>
  </g>

  <!-- Atom Eve Character Artwork -->
  <g id="atomeve-character" filter="url(#eveShadow)">
    
    <!-- Flowing Reddish-Auburn Hair (Flowing Outward with Energy) -->
    <g class="hair-backdrop">
      <path d="M210,130 C160,110 130,170 120,240 C100,320 130,420 160,460 C140,380 150,280 180,240 Z" fill="#D63A1E" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <path d="M290,130 C340,110 370,170 380,240 C400,320 370,420 340,460 C360,380 350,280 320,240 Z" fill="#D63A1E" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <path d="M140,260 C125,320 145,390 160,430" stroke="#FF7759" stroke-width="3" fill="none"/>
      <path d="M360,260 C375,320 355,390 340,430" stroke="#FF7759" stroke-width="3" fill="none"/>
    </g>

    <!-- Lower Body / Tights (Vivid Pink Suit with Magenta Accent Boots) -->
    <g class="legs-group">
      <!-- Left Leg (Graceful Floating Flight) -->
      <polygon points="215,410 195,510 180,600 220,605 235,510 240,410" fill="#FF3399" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <!-- Magenta Boot -->
      <polygon points="180,600 170,635 225,635 220,605" fill="#B30059" stroke="#080808" stroke-width="5"/>
      <!-- Right Leg (Graceful Floating Flight) -->
      <polygon points="260,410 265,510 280,600 240,605 235,510 240,410" fill="#FF3399" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <!-- Magenta Boot -->
      <polygon points="240,605 235,635 290,635 280,600" fill="#B30059" stroke="#080808" stroke-width="5"/>
      <!-- Pink Highlight -->
      <path d="M210,430 L200,500 L212,520" stroke="#FF80BF" stroke-width="3" fill="none"/>
      <path d="M265,430 L270,500 L258,520" stroke="#FF80BF" stroke-width="3" fill="none"/>
    </g>

    <!-- Torso: Pink Superhero Suit with Iconic Atom Emblem -->
    <g class="torso-group">
      <!-- Pink Body Base -->
      <polygon points="190,230 310,230 290,420 210,420" fill="#FF3399" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <!-- Magenta Side Contours -->
      <polygon points="190,230 215,230 230,420 210,420" fill="#B30059"/>
      <polygon points="310,230 285,230 270,420 290,420" fill="#B30059"/>

      <!-- Iconic Atomic Symbol Crest (Orbital Oval & Cross) -->
      <circle cx="250" cy="290" r="22" fill="#FFFFFF" stroke="#080808" stroke-width="4"/>
      <!-- Orbiting Electron Oval inside crest -->
      <ellipse cx="250" cy="290" rx="16" ry="6" fill="none" stroke="#FF3399" stroke-width="3" transform="rotate(45 250 290)"/>
      <ellipse cx="250" cy="290" rx="16" ry="6" fill="none" stroke="#FF3399" stroke-width="3" transform="rotate(-45 250 290)"/>
      <circle cx="250" cy="290" r="4" fill="#080808"/>

      <!-- Magenta Belt -->
      <polygon points="210,405 290,405 285,425 215,425" fill="#B30059" stroke="#080808" stroke-width="4"/>
    </g>

    <!-- Arms Radiating Subatomic Energy Spheres -->
    <g class="arms-group">
      <!-- Left Arm Channeling Energy -->
      <polygon points="190,235 130,270 120,340 170,305" fill="#FF3399" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <polygon points="130,270 95,330 135,350 140,295" fill="#FF80BF" stroke="#080808" stroke-width="4.5" stroke-linejoin="round"/>
      
      <!-- Energy Sphere in Left Hand -->
      <g class="energy-ball-left">
        <circle cx="100" cy="355" r="25" fill="#FF3399" opacity="0.6"/>
        <circle cx="100" cy="355" r="16" fill="#FFFFFF" stroke="#FF3399" stroke-width="3"/>
        <line x1="75" y1="355" x2="125" y2="355" stroke="#FFE500" stroke-width="2.5"/>
        <line x1="100" y1="330" x2="100" y2="380" stroke="#FFE500" stroke-width="2.5"/>
      </g>
      
      <!-- Right Arm Channeling Energy -->
      <polygon points="310,235 370,270 380,340 330,305" fill="#FF3399" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <polygon points="370,270 405,330 365,350 360,295" fill="#FF80BF" stroke="#080808" stroke-width="4.5" stroke-linejoin="round"/>
      
      <!-- Energy Sphere in Right Hand -->
      <g class="energy-ball-right">
        <circle cx="400" cy="355" r="25" fill="#FF3399" opacity="0.6"/>
        <circle cx="400" cy="355" r="16" fill="#FFFFFF" stroke="#FF3399" stroke-width="3"/>
        <line x1="375" y1="355" x2="425" y2="355" stroke="#FFE500" stroke-width="2.5"/>
        <line x1="400" y1="330" x2="400" y2="380" stroke="#FFE500" stroke-width="2.5"/>
      </g>
    </g>

    <!-- Head & Heroic Expression -->
    <g class="head-group">
      <!-- Neck -->
      <polygon points="235,210 265,210 270,175 230,175" fill="#FFCF9E" stroke="#080808" stroke-width="4"/>
      <!-- Jaw & Chin -->
      <polygon points="230,175 250,195 270,175 275,135 225,135" fill="#FFCF9E" stroke="#080808" stroke-width="4.5" stroke-linejoin="round"/>
      
      <!-- Expressive Eyes -->
      <polygon points="235,145 248,142 244,149 236,149" fill="#FFFFFF" stroke="#080808" stroke-width="2"/>
      <polygon points="265,145 252,142 256,149 264,149" fill="#FFFFFF" stroke="#080808" stroke-width="2"/>
      <circle cx="242" cy="146" r="2.5" fill="#0D4EC7"/>
      <circle cx="258" cy="146" r="2.5" fill="#0D4EC7"/>
      <path d="M232,138 L248,140" stroke="#080808" stroke-width="3"/>
      <path d="M268,138 L252,140" stroke="#080808" stroke-width="3"/>

      <!-- Smile / Confident Expression -->
      <path d="M242,168 C248,174 252,174 258,168" stroke="#D63A1E" stroke-width="2.5" fill="none"/>

      <!-- Hair Front & Bangs -->
      <path d="M225,135 C235,115 250,105 275,135 C270,110 250,90 230,110 Z" fill="#D63A1E" stroke="#080808" stroke-width="4.5"/>
    </g>

  </g>
</svg>

