<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%">
  <defs>
    <!-- Fierce Combat Radial Aura -->
    <radialGradient id="beastAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E52B35" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#42060A" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#080808" stop-opacity="0"/>
    </radialGradient>
    <filter id="beastShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="10" dy="12" stdDeviation="0" flood-color="#080808" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- Background Comic Impact Starburst (Jagged Inking) -->
  <g class="beast-backdrop" opacity="0.9">
    <circle cx="250" cy="310" r="230" fill="url(#beastAura)"/>
    <!-- Jagged Impact Shards -->
    <polygon points="250,40 280,180 390,90 320,220 470,200 350,290 450,400 310,360 380,510 260,400 230,520 200,370 70,430 160,290 40,240 180,210 100,100 230,170" fill="none" stroke="#E52B35" stroke-width="4" stroke-dasharray="20 12"/>
    <line x1="20" y1="20" x2="80" y2="80" stroke="#FFE500" stroke-width="4"/>
    <line x1="480" y1="50" x2="420" y2="100" stroke="#FFE500" stroke-width="4"/>
  </g>

  <!-- Battle Beast Character Artwork -->
  <g id="battle-beast-character" filter="url(#beastShadow)">
    
    <!-- Massive Two-Handed Battle Weapon (Sword / Cleaver) -->
    <g class="weapon-blade">
      <polygon points="110,60 145,40 165,340 120,350" fill="#D9D9D9" stroke="#080808" stroke-width="6" stroke-linejoin="round"/>
      <polygon points="120,70 140,55 155,330 130,335" fill="#FFFFFF"/>
      <!-- Serrated Blade Jag -->
      <polygon points="145,150 170,165 150,190" fill="#D9D9D9" stroke="#080808" stroke-width="4"/>
      <!-- Weapon Hilt & Crossguard -->
      <rect x="100" y="340" width="80" height="25" rx="4" fill="#E52B35" stroke="#080808" stroke-width="4.5"/>
      <rect x="130" y="365" width="20" height="90" fill="#222" stroke="#080808" stroke-width="4"/>
      <circle cx="140" cy="465" r="14" fill="#FFE500" stroke="#080808" stroke-width="4"/>
    </g>

    <!-- Lower Body / Battle Greaves (Armored & Spurred) -->
    <g class="legs-group">
      <!-- Left Leg -->
      <polygon points="180,420 160,520 140,610 190,615 210,520 220,420" fill="#2B303A" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <polygon points="140,610 130,635 195,635 190,615" fill="#E52B35" stroke="#080808" stroke-width="5"/>
      <!-- Right Leg -->
      <polygon points="255,420 265,520 285,610 235,615 230,520 235,420" fill="#2B303A" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <polygon points="235,615 230,635 295,635 285,610" fill="#E52B35" stroke="#080808" stroke-width="5"/>
      <!-- Knee Spikes -->
      <polygon points="150,510 130,520 160,535" fill="#D9D9D9" stroke="#080808" stroke-width="3.5"/>
      <polygon points="275,510 295,520 265,535" fill="#D9D9D9" stroke="#080808" stroke-width="3.5"/>
    </g>

    <!-- Torso: Heavy Spiked Gladiator Armor & White Fur -->
    <g class="torso-group">
      <!-- Dark Iron Breastplate -->
      <polygon points="170,230 330,230 310,430 190,430" fill="#1A1E24" stroke="#080808" stroke-width="5.5" stroke-linejoin="round"/>
      <!-- Crimson Chest Straps & Sigils -->
      <polygon points="175,235 210,235 305,420 280,420" fill="#E52B35" stroke="#080808" stroke-width="4"/>
      <polygon points="325,235 290,235 195,420 220,420" fill="#E52B35" stroke="#080808" stroke-width="4"/>
      <!-- Central Iron Medallion -->
      <circle cx="250" cy="325" r="22" fill="#FFE500" stroke="#080808" stroke-width="4.5"/>
      <polygon points="250,310 262,335 238,335" fill="#080808"/>
      <!-- White Fur Tufting Peeking Around Armor Edges -->
      <path d="M165,240 C150,260 160,280 170,300" stroke="#FFFFFF" stroke-width="5" fill="none"/>
      <path d="M335,240 C350,260 340,280 330,300" stroke="#FFFFFF" stroke-width="5" fill="none"/>
    </g>

    <!-- Massive Armored Arms & Spiked Gauntlets -->
    <g class="arms-group">
      <!-- Left Arm Gripping Weapon Hilt -->
      <polygon points="170,240 120,290 135,380 180,340" fill="#FFFFFF" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <!-- Spiked Gauntlet -->
      <polygon points="120,290 95,360 145,375 140,305" fill="#1A1E24" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <polygon points="90,320 70,325 95,340" fill="#D9D9D9" stroke="#080808" stroke-width="3.5"/>
      <polygon points="95,345 75,355 100,365" fill="#D9D9D9" stroke="#080808" stroke-width="3.5"/>
      <circle cx="140" cy="385" r="18" fill="#1A1E24" stroke="#080808" stroke-width="4.5"/>
      
      <!-- Right Arm (Raised in Battle Stance) -->
      <polygon points="330,240 390,270 380,360 325,320" fill="#FFFFFF" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <polygon points="390,270 415,350 375,370 370,300" fill="#1A1E24" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <!-- Spikes on Right Gauntlet -->
      <polygon points="415,295 435,305 410,315" fill="#D9D9D9" stroke="#080808" stroke-width="3.5"/>
      <polygon points="415,325 435,335 410,345" fill="#D9D9D9" stroke="#080808" stroke-width="3.5"/>
      <circle cx="395" cy="385" r="18" fill="#1A1E24" stroke="#080808" stroke-width="4.5"/>
    </g>

    <!-- Head: Roaring Lion-Beast with Wild Mane & Fangs -->
    <g class="head-group">
      <!-- Wild Lion Mane (Pure White / Cream with Heavy Inking) -->
      <path d="M190,140 C160,110 150,170 140,210 C160,205 170,225 155,250 C180,245 190,270 180,290 C210,265 240,275 250,260 C260,275 290,265 320,290 C310,270 320,245 345,250 C330,225 340,205 360,210 C350,170 340,110 310,140 C330,90 280,70 250,75 C220,70 170,90 190,140 Z" fill="#F0EFEA" stroke="#080808" stroke-width="5.5" stroke-linejoin="round"/>
      
      <!-- Feline Face & Muzzle -->
      <polygon points="215,160 250,185 285,160 275,130 225,130" fill="#FFFFFF" stroke="#080808" stroke-width="4.5"/>
      <!-- Black Nose -->
      <polygon points="245,155 255,155 250,165" fill="#080808"/>
      
      <!-- Roaring Open Jaws (Dark Red Throat & Razor Fangs) -->
      <polygon points="225,170 275,170 265,210 235,210" fill="#800A10" stroke="#080808" stroke-width="4.5" stroke-linejoin="round"/>
      <!-- Top Fangs -->
      <polygon points="232,170 238,185 242,170" fill="#FFFFFF" stroke="#080808" stroke-width="2"/>
      <polygon points="258,170 262,185 268,170" fill="#FFFFFF" stroke="#080808" stroke-width="2"/>
      <!-- Bottom Fangs -->
      <polygon points="238,210 242,195 246,210" fill="#FFFFFF" stroke="#080808" stroke-width="2"/>
      <polygon points="254,210 258,195 262,210" fill="#FFFFFF" stroke="#080808" stroke-width="2"/>

      <!-- Ferocious Amber / Crimson Eyes -->
      <polygon points="228,135 242,132 238,140 230,140" fill="#FFE500" stroke="#080808" stroke-width="2.5"/>
      <polygon points="272,135 258,132 262,140 270,140" fill="#FFE500" stroke="#080808" stroke-width="2.5"/>
      <circle cx="235" cy="136" r="2.5" fill="#E52B35"/>
      <circle cx="265" cy="136" r="2.5" fill="#E52B35"/>
      <!-- Battle Scar Over Left Eye -->
      <line x1="230" y1="125" x2="240" y2="150" stroke="#E52B35" stroke-width="3"/>
    </g>

  </g>
</svg>

