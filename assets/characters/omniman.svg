<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%">
  <defs>
    <!-- Heavy Omni-Man Red Energy Shadow -->
    <radialGradient id="omniAura" cx="45%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E52B35" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#2B0508" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#080808" stop-opacity="0"/>
    </radialGradient>
    <filter id="omniShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="10" dy="12" stdDeviation="0" flood-color="#080808" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- Background Speed & Power Rift -->
  <g class="omni-backdrop" opacity="0.85">
    <circle cx="240" cy="320" r="220" fill="url(#omniAura)"/>
    <!-- Deep Crimson Speed Lines -->
    <line x1="80" y1="200" x2="30" y2="220" stroke="#E52B35" stroke-width="5" stroke-linecap="round"/>
    <line x1="90" y1="340" x2="20" y2="370" stroke="#E52B35" stroke-width="6" stroke-linecap="round"/>
    <line x1="100" y1="460" x2="40" y2="490" stroke="#E52B35" stroke-width="4" stroke-linecap="round"/>
    <line x1="420" y1="180" x2="480" y2="160" stroke="#E52B35" stroke-width="5" stroke-linecap="round"/>
    <line x1="410" y1="360" x2="470" y2="380" stroke="#E52B35" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Omni-Man Character Artwork -->
  <g id="omniman-character" filter="url(#omniShadow)">
    
    <!-- Flowing Red Cape (Billowing Outward) -->
    <g class="cape-group">
      <path d="M180,210 C140,240 80,320 50,440 C30,520 60,610 120,620 C100,530 130,420 180,360 Z" fill="#E52B35" stroke="#080808" stroke-width="5.5" stroke-linejoin="round"/>
      <path d="M170,225 C135,260 90,340 70,450 C95,410 130,350 170,300 Z" fill="#BA141D"/>
      <!-- Cape Collar / Shoulders -->
      <polygon points="175,200 205,185 240,210 185,225" fill="#E52B35" stroke="#080808" stroke-width="4.5"/>
    </g>

    <!-- Lower Body / Tights (Pure White with Crimson Boots) -->
    <g class="legs-group">
      <!-- Left Leg (Slightly Forward) -->
      <polygon points="190,420 175,520 155,600 200,605 215,520 225,420" fill="#FFFFFF" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <!-- Left Red Boot -->
      <polygon points="155,600 145,635 205,635 200,605" fill="#E52B35" stroke="#080808" stroke-width="5"/>
      
      <!-- Right Leg -->
      <polygon points="240,420 250,520 265,600 220,605 215,520 225,420" fill="#FFFFFF" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <!-- Right Red Boot -->
      <polygon points="220,605 215,635 275,635 265,600" fill="#E52B35" stroke="#080808" stroke-width="5"/>

      <!-- Muscular Quad Shading -->
      <path d="M190,440 L180,500 L195,515" stroke="#080808" stroke-width="3.5" fill="none"/>
      <path d="M245,440 L250,500 L240,515" stroke="#080808" stroke-width="3.5" fill="none"/>
    </g>

    <!-- Torso (Pure White Suit with Iconic Crimson Chest Insignia) -->
    <g class="torso-group">
      <!-- Base Torso -->
      <polygon points="180,210 330,210 300,430 190,430" fill="#FFFFFF" stroke="#080808" stroke-width="5.5" stroke-linejoin="round"/>
      
      <!-- Iconic Crimson "O" Chest Emblem / Chevron -->
      <polygon points="255,220 325,220 310,310 255,360 200,310 185,220" fill="#E52B35" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <!-- Inner White Cutout forming the iconic O-shape -->
      <polygon points="255,250 295,250 285,300 255,330 225,300 215,250" fill="#FFFFFF" stroke="#080808" stroke-width="4.5" stroke-linejoin="round"/>
      <circle cx="255" cy="275" r="14" fill="#E52B35"/>

      <!-- Red Waist Belt -->
      <polygon points="190,410 300,410 295,435 195,435" fill="#E52B35" stroke="#080808" stroke-width="4.5"/>
      <circle cx="247" cy="422" r="7" fill="#FFFFFF" stroke="#080808" stroke-width="3"/>

      <!-- Muscular Pectoral Definition -->
      <path d="M205,330 C225,340 245,340 255,330" stroke="#080808" stroke-width="3.5" fill="none"/>
      <path d="M255,330 C265,340 285,340 305,330" stroke="#080808" stroke-width="3.5" fill="none"/>
      <line x1="247" y1="340" x2="247" y2="400" stroke="#080808" stroke-width="3"/>
    </g>

    <!-- Arms & Fists (Immovable Power Stance) -->
    <g class="arms-group">
      <!-- Left Arm & Clenched Fist -->
      <polygon points="180,220 135,280 145,370 190,320" fill="#FFFFFF" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <!-- Red Gauntlet / Forearm -->
      <polygon points="135,280 115,370 155,385 145,310" fill="#E52B35" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <circle cx="130" cy="395" r="18" fill="#E52B35" stroke="#080808" stroke-width="4.5"/>
      
      <!-- Right Arm & Clenched Fist -->
      <polygon points="330,220 375,280 365,370 320,320" fill="#FFFFFF" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <!-- Red Gauntlet / Forearm -->
      <polygon points="375,280 395,370 355,385 365,310" fill="#E52B35" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <circle cx="380" cy="395" r="18" fill="#E52B35" stroke="#080808" stroke-width="4.5"/>
    </g>

    <!-- Head & Visage (Distinguished Viltrumite Warrior) -->
    <g class="head-group">
      <!-- Neck -->
      <polygon points="230,195 275,195 285,155 220,155" fill="#FFCF9E" stroke="#080808" stroke-width="4"/>
      <!-- Jaw, Chin & Cheeks -->
      <polygon points="220,155 255,180 290,155 295,115 215,115" fill="#FFCF9E" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      
      <!-- Iconic Dark Viltrumite Mustache -->
      <path d="M230,146 C242,150 250,140 255,138 C260,140 268,150 280,146 C274,155 260,155 255,148 C250,155 236,155 230,146 Z" fill="#080808" stroke="#080808" stroke-width="3"/>
      
      <!-- Stoic Eyes & Heavy Brow -->
      <polygon points="232,125 248,122 244,129 234,129" fill="#FFFFFF" stroke="#080808" stroke-width="2.5"/>
      <polygon points="278,125 262,122 266,129 276,129" fill="#FFFFFF" stroke="#080808" stroke-width="2.5"/>
      <circle cx="240" cy="126" r="2.5" fill="#080808"/>
      <circle cx="270" cy="126" r="2.5" fill="#080808"/>
      <line x1="226" y1="120" x2="252" y2="120" stroke="#080808" stroke-width="3.5"/>
      <line x1="284" y1="120" x2="258" y2="120" stroke="#080808" stroke-width="3.5"/>

      <!-- Dark Hair with Distinguished White Temples -->
      <path d="M215,120 C210,80 235,65 255,65 C275,65 300,80 295,120 C285,85 270,78 255,78 C240,78 225,85 215,120 Z" fill="#141414" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <!-- Iconic Grey / White Temples -->
      <polygon points="215,115 225,100 230,115" fill="#D9D9D9" stroke="#080808" stroke-width="2"/>
      <polygon points="295,115 285,100 280,115" fill="#D9D9D9" stroke="#080808" stroke-width="2"/>
    </g>

  </g>
</svg>

