<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%">
  <defs>
    <!-- Crimson Regal Glow Gradient -->
    <radialGradient id="thraggAura" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#E52B35" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#800A10" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#080808" stop-opacity="0"/>
    </radialGradient>
    <filter id="thraggShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="12" stdDeviation="0" flood-color="#080808" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- Background Imperial Aura & Geometric Impact Spikes -->
  <g class="thragg-backdrop" opacity="0.9">
    <circle cx="250" cy="300" r="220" fill="url(#thraggAura)"/>
    <!-- Crimson Angular Impact Ring -->
    <polygon points="250,60 270,180 380,120 310,220 440,250 330,290 410,380 290,360 320,490 250,400 180,490 210,360 90,380 170,290 60,250 190,220 120,120 230,180" fill="none" stroke="#E52B35" stroke-width="3" stroke-dasharray="14 8"/>
  </g>

  <!-- Grand Regent Character Anatomy -->
  <g id="thragg-character" filter="url(#thraggShadow)">
    
    <!-- Heavy White Cape (Flowing symmetrically behind shoulders) -->
    <g class="cape-group">
      <!-- Cape Left Wing -->
      <polygon points="170,200 60,380 90,580 160,540 190,320" fill="#E6E6E6" stroke="#080808" stroke-width="5.5" stroke-linejoin="round"/>
      <polygon points="150,220 75,370 100,560 145,530 175,330" fill="#CACACA"/>
      <!-- Cape Right Wing -->
      <polygon points="330,200 440,380 410,580 340,540 310,320" fill="#E6E6E6" stroke="#080808" stroke-width="5.5" stroke-linejoin="round"/>
      <polygon points="350,220 425,370 400,560 355,530 325,330" fill="#CACACA"/>
    </g>

    <!-- Lower Body / Tights (Pure Imperial White with Black Inking) -->
    <g class="legs-group">
      <!-- Left Leg (Planting firmly) -->
      <polygon points="210,400 190,520 170,610 215,615 235,520 240,400" fill="#FFFFFF" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <polygon points="170,610 160,635 220,635 215,615" fill="#E52B35" stroke="#080808" stroke-width="5"/>
      <!-- Right Leg (Planting firmly) -->
      <polygon points="260,400 265,520 285,520 305,610 260,615 240,400" fill="#FFFFFF" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <polygon points="260,615 255,635 315,635 305,610" fill="#E52B35" stroke="#080808" stroke-width="5"/>
      <!-- Muscle Contour Shadows -->
      <path d="M205,430 L195,500 L210,515" stroke="#080808" stroke-width="3" fill="none"/>
      <path d="M275,430 L280,500 L270,515" stroke="#080808" stroke-width="3" fill="none"/>
    </g>

    <!-- Torso: Grand Regent High-Collar Armor & Imperial Crimson Sash -->
    <g class="torso-group">
      <!-- Muscular Chest (White) -->
      <polygon points="180,210 320,210 300,410 200,410" fill="#FFFFFF" stroke="#080808" stroke-width="5.5" stroke-linejoin="round"/>
      
      <!-- Regal Crimson Shoulder Epaulets / High Collar -->
      <polygon points="160,200 210,170 290,170 340,200 320,240 180,240" fill="#E52B35" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <polygon points="175,205 215,185 285,185 325,205 310,230 190,230" fill="#B51B24"/>

      <!-- Diagonal Imperial Crimson Sash Across Chest -->
      <polygon points="295,195 330,220 220,410 185,410" fill="#E52B35" stroke="#080808" stroke-width="4.5" stroke-linejoin="round"/>
      <polygon points="305,205 325,220 230,400 205,400" fill="#FF4752"/>

      <!-- Gold / Crimson Imperial Crest Brooch -->
      <polygon points="250,215 268,235 250,255 232,235" fill="#FFE500" stroke="#080808" stroke-width="4"/>
      <circle cx="250" cy="235" r="5" fill="#E52B35"/>
      
      <!-- Pectoral & Abdominal Ink Cuts -->
      <path d="M220,260 C240,270 260,270 280,260" stroke="#080808" stroke-width="4" fill="none"/>
      <line x1="250" y1="270" x2="250" y2="380" stroke="#080808" stroke-width="3.5"/>
      <path d="M230,310 L250,320 L270,310" stroke="#080808" stroke-width="3" fill="none"/>
      <path d="M232,350 L250,360 L268,350" stroke="#080808" stroke-width="3" fill="none"/>
    </g>

    <!-- Crossed / Clenched Arms (Uncompromising Authority) -->
    <g class="arms-group">
      <!-- Left Upper Arm & Gauntlet -->
      <polygon points="180,230 130,270 145,350 190,320" fill="#FFFFFF" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <!-- Left Clenched Crimson Gauntlet -->
      <polygon points="135,320 180,360 210,340 185,300" fill="#E52B35" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      
      <!-- Right Upper Arm & Gauntlet -->
      <polygon points="320,230 370,270 355,350 310,320" fill="#FFFFFF" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <!-- Right Clenched Crimson Gauntlet Overlap -->
      <polygon points="365,320 320,360 270,345 295,300" fill="#E52B35" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      
      <!-- Powerful Clenched Fists -->
      <circle cx="215" cy="345" r="18" fill="#E52B35" stroke="#080808" stroke-width="4"/>
      <circle cx="285" cy="345" r="18" fill="#E52B35" stroke="#080808" stroke-width="4"/>
    </g>

    <!-- Head & Regal Viltrumite Visage -->
    <g class="head-group">
      <!-- Strong Neck & Trapezius -->
      <polygon points="225,185 275,185 285,150 215,150" fill="#FFCF9E" stroke="#080808" stroke-width="4"/>
      <!-- Chiseled Jaw & Chin -->
      <polygon points="215,150 250,175 285,150 290,110 210,110" fill="#FFCF9E" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      
      <!-- Dark Imperial Viltrumite Mustache (Authoritative) -->
      <path d="M225,138 C238,144 246,134 250,132 C254,134 262,144 275,138 C268,148 255,148 250,142 C245,148 232,148 225,138 Z" fill="#080808" stroke="#080808" stroke-width="3"/>
      
      <!-- Stern Intense Eyes & Brow -->
      <polygon points="228,118 244,115 240,123 230,123" fill="#FFFFFF" stroke="#080808" stroke-width="2.5"/>
      <polygon points="272,118 256,115 260,123 270,123" fill="#FFFFFF" stroke="#080808" stroke-width="2.5"/>
      <circle cx="236" cy="119" r="2.5" fill="#080808"/>
      <circle cx="264" cy="119" r="2.5" fill="#080808"/>
      <line x1="222" y1="112" x2="248" y2="114" stroke="#080808" stroke-width="3.5"/>
      <line x1="278" y1="112" x2="252" y2="114" stroke="#080808" stroke-width="3.5"/>

      <!-- Slick Dark Hair (Combed back regal Viltrumite mane) -->
      <path d="M210,115 C205,80 230,60 250,60 C270,60 295,80 290,115 C280,85 265,75 250,75 C235,75 220,85 210,115 Z" fill="#141414" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
      <path d="M240,70 C245,80 250,85 260,85" stroke="#444" stroke-width="2.5" fill="none"/>
    </g>

  </g>
</svg>

